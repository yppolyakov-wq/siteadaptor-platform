<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Design – Format der Fotos</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Inter,system-ui,sans-serif;color:#16181d}
a{color:#3730a3}a:hover{color:#1e1b4b}
</style>
</helmet>
<div style="width: 1040px; height: 980px; box-sizing: border-box; background: #f3f4f6; padding: 28px 32px; display: flex; flex-direction: column; gap: 16px">
  <h1 style="margin: 0; font-size: 24px; font-weight: 700">Design</h1>
  <div style="display: flex; gap: 4px; border-bottom: 1px solid #d1d5db; font-size: 14px; font-weight: 600">
    <span style="padding: 12px 16px; color: #374151">Fertige Designs</span>
    <span style="padding: 12px 16px; color: #374151">Farben &amp; Schrift</span>
    <span style="padding: 12px 16px; color: #3730a3; border-bottom: 2px solid #4338ca">Karten &amp; Fotos</span>
  </div>

  <div style="background: #fff; border-radius: 16px; padding: 22px; display: flex; flex-direction: column; gap: 18px; flex-grow: 1">
    <div>
      <div style="font-weight: 700; font-size: 17px">Format der Fotos</div>
      <div style="font-size: 14px; color: #4b5563">Wählen Sie den Bereich, dann das Format. Das Beispiel zeigt, wie Ihr Foto dort aussieht.</div>
    </div>

    <div style="display: flex; flex-wrap: wrap; gap: 6px; font-size: 14px; font-weight: 600">
      <button style="min-height: 44px; padding: 0 14px; border: 2px solid #4338ca; background: #eef2ff; color: #312e81; border-radius: 999px">Produkte · 1:1, ganz</button>
      <button style="min-height: 44px; padding: 0 14px; border: 1px solid #6b7280; background: #fff; border-radius: 999px">Aktionen · Standard</button>
      <button style="min-height: 44px; padding: 0 14px; border: 1px solid #6b7280; background: #fff; border-radius: 999px">Leistungen, Zimmer</button>
      <button style="min-height: 44px; padding: 0 14px; border: 1px solid #6b7280; background: #fff; border-radius: 999px">Kategorien</button>
      <button style="min-height: 44px; padding: 0 14px; border: 1px solid #6b7280; background: #fff; border-radius: 999px">Kombis</button>
      <button style="min-height: 44px; padding: 0 14px; border: 1px solid #6b7280; background: #fff; border-radius: 999px">Touren</button>
      <button style="min-height: 44px; padding: 0 14px; border: 1px solid #6b7280; background: #fff; border-radius: 999px">Produktseite · 1:1, ganz</button>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="font-weight: 600; font-size: 14px">Seitenverhältnis</div>
      <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px">
        <button style="border: 1px solid #6b7280; background: #fff; border-radius: 12px; padding: 10px 6px; display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; min-height: 104px; justify-content: flex-end"><span style="display: block; width: 52px; height: 40px; border: 2px dashed #9ca3af; border-radius: 6px"></span>Standard</button>
        <button style="border: 2px solid #4338ca; background: #eef2ff; color: #312e81; border-radius: 12px; padding: 10px 6px; display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; min-height: 104px; justify-content: flex-end"><span style="display: block; width: 48px; height: 48px; background: #a5b4fc; border-radius: 6px"></span>1:1</button>
        <button style="border: 1px solid #6b7280; background: #fff; border-radius: 12px; padding: 10px 6px; display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; min-height: 104px; justify-content: flex-end"><span style="display: block; width: 56px; height: 42px; background: #d1d5db; border-radius: 6px"></span>4:3</button>
        <button style="border: 1px solid #6b7280; background: #fff; border-radius: 12px; padding: 10px 6px; display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; min-height: 104px; justify-content: flex-end"><span style="display: block; width: 60px; height: 40px; background: #d1d5db; border-radius: 6px"></span>3:2</button>
        <button style="border: 1px solid #6b7280; background: #fff; border-radius: 12px; padding: 10px 6px; display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; min-height: 104px; justify-content: flex-end"><span style="display: block; width: 39px; height: 52px; background: #d1d5db; border-radius: 6px"></span>3:4</button>
        <button style="border: 1px solid #6b7280; background: #fff; border-radius: 12px; padding: 10px 6px; display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; min-height: 104px; justify-content: flex-end"><span style="display: block; width: 64px; height: 36px; background: #d1d5db; border-radius: 6px"></span>16:9</button>
        <button style="border: 1px solid #6b7280; background: #fff; border-radius: 12px; padding: 10px 6px; display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; min-height: 104px; justify-content: flex-end"><span style="display: block; width: 48px; height: 48px; background: #d1d5db; border-radius: 999px"></span>Rund</button>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="font-weight: 600; font-size: 14px">Wenn das Foto ein anderes Format hat</div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
        <button style="border: 1px solid #6b7280; background: #fff; border-radius: 14px; padding: 14px; display: flex; gap: 14px; align-items: center; text-align: left">
          <span style="display: block; width: 96px; height: 96px; border-radius: 8px; background: #fde68a; overflow: hidden; position: relative; flex-shrink: 0"><span style="position: absolute; left: -28px; top: 26px; width: 152px; height: 44px; background: #b45309; border-radius: 6px"></span></span>
          <span style="display: flex; flex-direction: column; gap: 4px"><span style="font-weight: 600; font-size: 15px">Zuschneiden</span><span style="font-size: 13px; color: #4b5563">Füllt den Rahmen ganz aus. Ränder des Fotos können fehlen.</span></span>
        </button>
        <button style="border: 2px solid #4338ca; background: #eef2ff; border-radius: 14px; padding: 14px; display: flex; gap: 14px; align-items: center; text-align: left">
          <span style="display: flex; width: 96px; height: 96px; border-radius: 8px; background: #fef3c7; align-items: center; justify-content: center; flex-shrink: 0"><span style="display: block; width: 88px; height: 26px; background: #b45309; border-radius: 4px"></span></span>
          <span style="display: flex; flex-direction: column; gap: 4px"><span style="font-weight: 700; font-size: 15px; color: #312e81">Ganz zeigen</span><span style="font-size: 13px; color: #4b5563">Nichts wird abgeschnitten. Es bleiben Ränder im Rahmen.</span></span>
        </button>
      </div>
    </div>

    <div style="border: 1px solid #c7d2fe; background: #f5f7ff; border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
      <div style="font-size: 13px; font-weight: 600; color: #312e81">So sehen Produktkarten aus</div>
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px">
        <div style="background: #fff; border: 1px solid #c7d2fe; border-radius: 10px; padding: 8px; display: flex; flex-direction: column; gap: 6px"><div style="aspect-ratio: 1 / 1; background: #fef3c7; border-radius: 6px; display: flex; align-items: center; justify-content: center"><div style="width: 86%; height: 30%; background: #b45309; border-radius: 4px"></div></div><div style="height: 6px; background: #c7d2fe; border-radius: 3px"></div><div style="height: 6px; width: 40%; background: #a5b4fc; border-radius: 3px"></div></div>
        <div style="background: #fff; border: 1px solid #c7d2fe; border-radius: 10px; padding: 8px; display: flex; flex-direction: column; gap: 6px"><div style="aspect-ratio: 1 / 1; background: #fef3c7; border-radius: 6px; display: flex; align-items: center; justify-content: center"><div style="width: 40%; height: 86%; background: #b45309; border-radius: 4px"></div></div><div style="height: 6px; background: #c7d2fe; border-radius: 3px"></div><div style="height: 6px; width: 40%; background: #a5b4fc; border-radius: 3px"></div></div>
        <div style="background: #fff; border: 1px solid #c7d2fe; border-radius: 10px; padding: 8px; display: flex; flex-direction: column; gap: 6px"><div style="aspect-ratio: 1 / 1; background: #fef3c7; border-radius: 6px; display: flex; align-items: center; justify-content: center"><div style="width: 70%; height: 70%; background: #b45309; border-radius: 4px"></div></div><div style="height: 6px; background: #c7d2fe; border-radius: 3px"></div><div style="height: 6px; width: 40%; background: #a5b4fc; border-radius: 3px"></div></div>
        <div style="background: #fff; border: 1px solid #c7d2fe; border-radius: 10px; padding: 8px; display: flex; flex-direction: column; gap: 6px"><div style="aspect-ratio: 1 / 1; background: #fef3c7; border-radius: 6px; display: flex; align-items: center; justify-content: center"><div style="width: 86%; height: 50%; background: #b45309; border-radius: 4px"></div></div><div style="height: 6px; background: #c7d2fe; border-radius: 3px"></div><div style="height: 6px; width: 40%; background: #a5b4fc; border-radius: 3px"></div></div>
      </div>
    </div>

    <div style="margin-top: auto"><button style="border: 0; background: #4338ca; color: #fff; border-radius: 10px; padding: 13px 20px; font-weight: 600; font-size: 15px">Speichern</button></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1040,"height":980}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
