<html lang="de">
<head>
<meta charset="utf-8">
<title>SolingenMarkt – V6 Tagesablauf</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F6F7F9}
a{color:#C2410C;text-decoration:none}a:hover{color:#9A3412}
</style>
</helmet>
<div style="font-family: Inter, system-ui, sans-serif; color: #111827; background: #F6F7F9">
<header style="background: #FFFFFF; border-bottom: 1px solid #E5E7EB">
  <div style="max-width: 1360px; margin: 0 auto; padding: 14px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 16px">
    <span style="font-weight: 800; font-size: 20px; letter-spacing: -0.02em">Solingen<span style="color: #C2410C">Markt</span></span>
    <label style="flex: 1 1 360px; display: flex; align-items: center; gap: 8px; background: #F3F4F6; border-radius: 999px; padding: 0 18px; min-height: 44px">
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden">Suche</span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4B5563" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input type="search" placeholder="Suchen in Solingen" style="flex: 1; border: 0; background: transparent; font: 15px Inter, sans-serif; outline: none; min-height: 40px">
    </label>
    <a href="#" style="font-weight: 600; font-size: 14px">Anmelden</a>
  </div>
</header>

<main style="max-width: 1360px; margin: 0 auto; padding: 28px 24px 40px; display: flex; flex-direction: column; gap: 28px">
  <section aria-labelledby="day-h" style="background: #111827; color: #FFFFFF; border-radius: 24px; padding: 28px 32px; display: flex; flex-direction: column; gap: 22px">
    <div style="display: flex; flex-wrap: wrap; align-items: flex-end; gap: 16px">
      <div>
        <div style="font-size: 13px; font-weight: 700; letter-spacing: .06em; color: #FCD34D">SAMSTAG, 7. NOVEMBER · 14:20 UHR · 9 °C</div>
        <h1 id="day-h" style="margin: 6px 0 0; font-size: 42px; letter-spacing: -0.03em">Ihr Samstag in Solingen</h1>
      </div>
      <div role="group" aria-label="Tag wählen" style="margin-left: auto; display: flex; gap: 4px; background: #1F2937; border-radius: 999px; padding: 4px">
        <button type="button" style="border: 0; border-radius: 999px; padding: 8px 16px; background: #FFFFFF; color: #111827; font: 700 14px Inter, sans-serif; min-height: 40px">Heute</button>
        <button type="button" style="border: 0; border-radius: 999px; padding: 8px 16px; background: transparent; color: #FFFFFF; font: 600 14px Inter, sans-serif; min-height: 40px">Sonntag</button>
        <button type="button" style="border: 0; border-radius: 999px; padding: 8px 16px; background: transparent; color: #FFFFFF; font: 600 14px Inter, sans-serif; min-height: 40px">Montag</button>
      </div>
    </div>
    <div aria-label="Tagesleiste" style="position: relative; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px">
      <sc-for list="{{slots}}" as="s" hint-placeholder-count="5">
        <a href="#{{s.id}}" style="{{s.style}}">
          <span style="font-size: 12px; font-weight: 700; opacity: .85">{{s.time}}</span>
          <span style="font-size: 17px; font-weight: 800">{{s.t}}</span>
          <span style="font-size: 13px; opacity: .9">{{s.n}}</span>
        </a>
      </sc-for>
    </div>
  </section>

  <sc-for list="{{blocks}}" as="b" hint-placeholder-count="4">
    <section id="{{b.id}}" aria-label="{{b.t}}" style="display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 24px">
      <div style="display: flex; flex-direction: column; gap: 6px; border-left: 4px solid {{b.color}}; padding-left: 16px">
        <span style="font-size: 13px; font-weight: 700; color: {{b.color}}">{{b.time}}</span>
        <h2 style="margin: 0; font-size: 26px; letter-spacing: -0.02em">{{b.t}}</h2>
        <span style="font-size: 14px; color: #4B5563; line-height: 1.45">{{b.hint}}</span>
        <a href="#" style="font-weight: 700; font-size: 14px; margin-top: 4px">{{b.more}}</a>
      </div>
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px">
        <sc-for list="{{b.cards}}" as="c" hint-placeholder-count="4">
          <article style="background: #FFFFFF; border-radius: 18px; overflow: hidden; display: flex; flex-direction: column; border: 1px solid #E5E7EB">
            <div style="position: relative; aspect-ratio: 16 / 10"><img src="{{c.img}}" alt="" style="width: 100%; height: 100%; object-fit: cover; display: block">
              <span style="position: absolute; left: 10px; top: 10px; background: #FFFFFF; color: #111827; font-size: 12px; font-weight: 800; padding: 4px 10px; border-radius: 999px">{{c.when}}</span></div>
            <div style="padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; flex: 1">
              <span style="font-size: 12px; color: #4B5563">{{c.shop}}</span>
              <b style="font-size: 15px; line-height: 1.3">{{c.t}}</b>
              <div style="margin-top: auto; padding-top: 6px; display: flex; align-items: center"><b>{{c.p}}</b><a href="#" style="margin-left: auto; font-size: 13px; font-weight: 700">{{c.cta}} →</a></div>
            </div>
          </article>
        </sc-for>
      </div>
    </section>
  </sc-for>
</main>
</div>
</x-dc>

</body>
