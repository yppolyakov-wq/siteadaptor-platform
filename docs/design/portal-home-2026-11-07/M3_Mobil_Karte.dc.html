<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>SolingenMarkt – Mobil Karte mit Blatt</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#C2410C;text-decoration:none}a:hover{color:#9A3412}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; font-family: Inter, system-ui, sans-serif; color: #111827; background: #E8EEE6">
  <svg viewBox="0 0 390 844" width="390" height="844" style="position: absolute; inset: 0" role="img" aria-label="Karte Ohligs">
    <rect width="390" height="844" fill="#E8EEE6"/>
    <path d="M0 120 L390 80 L390 420 L0 460 Z" fill="#DCE6D6"/>
    <path d="M0 460 L390 420 L390 600 L0 640 Z" fill="#F2E6D8"/>
    <path d="M-20 300 C100 260 220 360 410 300" fill="none" stroke="#FFFFFF" stroke-width="10"/>
    <path d="M140 0 L180 844 M300 0 L250 600" fill="none" stroke="#FFFFFF" stroke-width="7"/>
    <path d="M0 560 C120 520 260 600 390 540" fill="none" stroke="#9EC5E3" stroke-width="12"/>
    <text x="196" y="250" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#374151">Ohligs</text>
  </svg>
  <sc-for list="{{pins}}" as="p" hint-placeholder-count="6">
    <span style="{{p.style}}">{{p.l}}</span>
  </sc-for>

  <div style="position: absolute; left: 12px; right: 12px; top: 12px; display: flex; flex-direction: column; gap: 8px">
    <label style="display: flex; align-items: center; gap: 8px; background: #FFFFFF; border-radius: 16px; padding: 0 14px; min-height: 48px; box-shadow: 0 2px 10px rgba(0,0,0,.15)">
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden">Suche</span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4B5563" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input type="search" placeholder="Suchen in Ohligs" style="flex: 1; border: 0; font: 16px Inter, sans-serif; outline: none; min-height: 44px">
    </label>
    <div style="display: flex; gap: 6px; overflow: hidden">
      <button type="button" aria-pressed="true" style="flex: 0 0 auto; border: 0; background: #111827; color: #FFFFFF; border-radius: 999px; padding: 8px 12px; font: 600 13px Inter, sans-serif; min-height: 40px">Jetzt offen</button>
      <button type="button" aria-pressed="false" style="flex: 0 0 auto; border: 0; background: #FFFFFF; border-radius: 999px; padding: 8px 12px; font: 600 13px Inter, sans-serif; min-height: 40px; box-shadow: 0 1px 4px rgba(0,0,0,.15)">Essen</button>
      <button type="button" aria-pressed="false" style="flex: 0 0 auto; border: 0; background: #FFFFFF; border-radius: 999px; padding: 8px 12px; font: 600 13px Inter, sans-serif; min-height: 40px; box-shadow: 0 1px 4px rgba(0,0,0,.15)">Angebote</button>
      <button type="button" aria-pressed="false" style="flex: 0 0 auto; border: 0; background: #FFFFFF; border-radius: 999px; padding: 8px 12px; font: 600 13px Inter, sans-serif; min-height: 40px; box-shadow: 0 1px 4px rgba(0,0,0,.15)">Heute Abend</button>
    </div>
  </div>

  <section aria-labelledby="sheet-h" style="position: absolute; left: 0; right: 0; bottom: 0; height: 430px; background: #FFFFFF; border-radius: 22px 22px 0 0; box-shadow: 0 -6px 24px rgba(0,0,0,.18); display: flex; flex-direction: column">
    <span aria-hidden="true" style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: #D1D5DB; margin: 10px 0 8px"></span>
    <div style="padding: 0 16px 8px; display: flex; align-items: baseline"><h2 id="sheet-h" style="margin: 0; font-size: 18px">17 offen in Ohligs</h2><a href="#" style="margin-left: auto; font-size: 13px; font-weight: 700">Liste ↑</a></div>
    <div style="display: flex; flex-direction: column; padding: 0 16px; gap: 10px">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="3">
        <a href="#" style="display: flex; gap: 12px; align-items: center; color: #111827; padding-bottom: 10px; border-bottom: 1px solid #F3F4F6">
          <img src="{{r.img}}" alt="" style="width: 76px; height: 76px; border-radius: 12px; object-fit: cover">
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; color: #4B5563">{{r.shop}} · {{r.dist}}</span><b style="font-size: 15px">{{r.t}}</b><span style="font-size: 12px; font-weight: 600; color: {{r.c}}">{{r.s}}</span></span>
          <b style="font-size: 15px">{{r.p}}</b>
        </a>
      </sc-for>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const B = '/_blob/', G = '#047857', A = '#B45309';
    const pos = [[150, 230, G, '6,50 €'], [230, 280, G, '1,50 €'], [90, 330, A, '8,50 €'], [270, 190, G, '69 €'], [190, 360, G, 'Event'], [60, 210, A, '16,90 €']];
    const pins = pos.map(([x, y, c, l]) => ({ l, style: 'position:absolute;left:' + x + 'px;top:' + y + 'px;background:' + c + ';color:#FFFFFF;font-size:12px;font-weight:800;padding:5px 9px;border-radius:999px;box-shadow:0 2px 6px rgba(0,0,0,.3);border:2px solid #FFFFFF' }));
    return {
      pins,
      rows: [
        { img: B+'b6b8e6b3e5f638e21a9cc342057ef0f4', shop: 'Café Ohligser Eck', dist: '200 m', t: 'Suppe des Tages', s: 'offen bis 15:00', c: G, p: '6,50 €' },
        { img: B+'1a9f5aed8fd7ca238974cdc49931468f', shop: 'Hofladen Wupperhof', dist: '450 m', t: 'MHD-Joghurt −40 %', s: 'offen bis 16:00 · noch 8', c: G, p: '1,50 €' },
        { img: B+'4865b863ef9aa474b10bf70621e51ca9', shop: 'Grill & Wrap Ohligs', dist: '600 m', t: 'Wrap + Getränk', s: 'öffnet 17:00', c: A, p: '8,50 €' }
      ]
    };
  }
}
</script>
</body>
</html>
