<x-dc>

    a { color: #4F46E5; } a:hover { color: #4338CA; }

<div style="width: 390px; height: 720px; background: #F2F4F7; color: #16181D; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden">

      <div style="font-size: 30px; font-weight: 700; margin-top: 4px">412,50 €</div>

          <div style="font-size: 11px; color: #6A7180">Anfragen</div>
        </div>
      </div>
    </div>
    <div style="background: #FFFFFF; border-radius: 22px; padding: 18px 20px; box-shadow: 0 6px 18px rgba(22, 24, 29, 0.05); display: flex; flex-direction: column; gap: 12px">
      <div style="height: 12px; width: 150px; background: #E7E9EE; border-radius: 6px"></div>
