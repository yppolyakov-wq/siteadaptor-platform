<!doctype html>
<html lang="de">
<head>

</head>

<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>

a{color:#111827}a:hover{color:#EA580C}

</helmet>
<div style="font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #111827; background: #FFFFFF">
  <header style="border-bottom: 1px solid #E5E7EB">
    <div style="max-width: 1360px; margin: 0 auto; padding: 14px 40px; display: flex; flex-wrap: wrap; align-items: center; gap: 16px">
      <span style="font-size: 24px; font-weight: 800; color: #EA580C">Solingen<span style="color: #111827">.markt</span></span>

          <img src="{{r.img}}" alt="" style="width: 44px; height: 44px; border-radius: 10px; object-fit: cover">
          <span style="flex: 1; display: flex; flex-direction: column"><span style="display: flex; gap: 6px; align-items: center"><span style="font-weight: 700; font-size: 15px; color: #111827">{{r.label}}</span><sc-if value="{{r.badge}}" hint-placeholder-val="{{ false }}"><span style="background: #EA580C; color: #FFFFFF; font-size: 10px; font-weight: 800; padding: 2px 6px; border-radius: 6px">{{r.badge}}</span></sc-if></span><span style="font-size: 12px; color: #6B7280">{{r.desc}}</span></span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9CA3AF" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>

          <span style="position: absolute; left: 32px; bottom: 30px; color: #FFFFFF; display: flex; flex-direction: column; gap: 8px">
            <span style="background: #EA580C; align-self: flex-start; font-weight: 800; padding: 6px 12px; border-radius: 999px">−30 % nur heute</span>

        <div style="display: grid; grid-template-rows: repeat(2, minmax(0, 1fr)); gap: 16px">
          <a href="#" style="border-radius: 20px; background: #FEF3C7; padding: 18px; text-decoration: none; display: flex; flex-direction: column; justify-content: space-between"><span style="font-weight: 800; font-size: 18px; color: #111827">Neu diese Woche</span><span style="font-size: 14px; color: #92400E">27 neue Angebote →</span></a>

        </div>
      </section>
      <section aria-label="Filter" style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center">
        <sc-for list="{{chips}}" as="c" hint-placeholder-count="6">
          <button type="button" style="height: 44px; padding: 0 16px; border-radius: 999px; border: 1.5px solid #E5E7EB; background: #F9FAFB; font: inherit; font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; cursor: pointer">{{c}} <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#111827" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
        </sc-for>
        <span style="margin-left: auto; font-size: 14px; color: #4B5563">1 284 Angebote</span>
      </section>
      <section aria-labelledby="bh">
        <h2 id="bh" style="margin: 0 0 14px; font-size: 24px; font-weight: 800">Beliebt diese Woche</h2>
        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px">
          <sc-for list="{{cards}}" as="it" hint-placeholder-count="6"><dc-import name="Card" item="{{it}}" hint-size="100%,470px"></dc-import></sc-for>
        </div>
      </section>
    </div>
  </main>
</div>
</x-dc>
