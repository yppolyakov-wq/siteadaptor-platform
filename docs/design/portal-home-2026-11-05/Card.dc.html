<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Angebotskarte</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#111827}a:hover{color:#C2410C}
</style>
</helmet>
<article style="font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #111827; background: #FFFFFF; border-radius: 18px; box-shadow: 0 1px 2px rgba(17,24,39,.06), 0 8px 24px rgba(17,24,39,.06); overflow: hidden; display: flex; flex-direction: column; width: 100%; box-sizing: border-box">
  <div style="position: relative; aspect-ratio: 4 / 3; background: #E5E7EB">
    <img src="{{it.img}}" alt="{{it.title}}" style="width: 100%; height: 100%; object-fit: cover; display: block">
    <div style="position: absolute; top: 12px; left: 12px; display: flex; flex-direction: column; gap: 6px; align-items: flex-start">
      <sc-if value="{{it.badge}}" hint-placeholder-val="{{ true }}"><span style="background: #C2410C; color: #FFFFFF; font-weight: 800; font-size: 14px; padding: 5px 10px; border-radius: 999px">{{it.badge}}</span></sc-if>
      <sc-if value="{{it.tag}}" hint-placeholder-val="{{ false }}"><span style="background: #FFFFFF; color: #111827; font-weight: 700; font-size: 12px; padding: 4px 9px; border-radius: 999px">{{it.tag}}</span></sc-if>
    </div>
    <button type="button" aria-label="Merken" style="position: absolute; top: 10px; right: 10px; width: 40px; height: 40px; border-radius: 999px; border: 0; background: rgba(255,255,255,.92); display: grid; place-items: center; cursor: pointer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#111827" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"></path></svg>
    </button>
    <sc-if value="{{it.timer}}" hint-placeholder-val="{{ false }}"><div style="position: absolute; left: 0; right: 0; bottom: 0; background: linear-gradient(0deg, rgba(17,24,39,.85), rgba(17,24,39,0)); color: #FFFFFF; padding: 22px 12px 10px; font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 6px">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FDBA74" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="13" r="8"></circle><path d="M12 9v4l2.5 2.5M9 2h6"></path></svg>
      <span>{{it.timer}}</span>
    </div></sc-if>
  </div>
  <div style="padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 8px; flex-grow: 1">
    <div style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #4B5563">
      <span style="width: 26px; height: 26px; border-radius: 999px; background: #FFEDD5; color: #9A3412; display: grid; place-items: center; font-weight: 800; font-size: 12px; flex-shrink: 0">{{it.initial}}</span>
      <span style="font-weight: 600; color: #1F2937; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{it.biz}}</span>
      <span style="white-space: nowrap">· {{it.district}}</span>
    </div>
    <h3 style="margin: 0; font-size: 17px; line-height: 1.3; font-weight: 700">{{it.title}}</h3>
    <div style="display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 13px; align-items: center">
      <span style="display: inline-flex; align-items: center; gap: 4px; font-weight: 700"><svg width="15" height="15" viewBox="0 0 24 24" fill="#F59E0B" aria-hidden="true"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4 6.1 20.5l1.2-6.5L2.5 9.4l6.6-.9z"></path></svg>{{it.rating}} <span style="color: #6B7280; font-weight: 500">({{it.reviews}})</span></span>
      <span style="color: #047857; font-weight: 600">{{it.open}}</span>
    </div>
    <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; margin-top: auto; padding-top: 4px">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <div style="display: flex; align-items: baseline; gap: 8px">
          <span style="font-size: 24px; font-weight: 800; color: #111827">{{it.price}}</span>
          <sc-if value="{{it.old}}" hint-placeholder-val="{{ true }}"><span style="font-size: 14px; color: #6B7280; text-decoration: line-through">{{it.old}}</span></sc-if>
        </div>
        <sc-if value="{{it.low30}}" hint-placeholder-val="{{ false }}"><span style="font-size: 11px; color: #6B7280">{{it.low30}}</span></sc-if>
      </div>
      <a href="#" style="background: #C2410C; color: #FFFFFF; text-decoration: none; font-weight: 700; font-size: 14px; padding: 11px 16px; border-radius: 999px; min-height: 44px; box-sizing: border-box; display: inline-flex; align-items: center; white-space: nowrap">{{it.action}}</a>
    </div>
  </div>
</article>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"item":{"editor":null},"$preview":{"width":320,"height":470}}'>
class Component extends DCLogic {
  renderVals() {
    const demo = { img: '/_blob/9eca54829f8d9ee2e2d47a6fb8e89742', badge: '−20 %', tag: 'Endet heute', timer: 'Endet in 02:14 h · noch 6 Stück', initial: 'K', biz: 'Bäckerei Klingenbrot', district: 'Ohligs', title: 'Roggen-Sauerteigbrot 1 kg, frisch aus dem Ofen', rating: '4,8', reviews: '126', open: 'Geöffnet bis 18:00', price: '3,90 €', old: '4,90 €', low30: 'Niedrigster Preis 30 Tage: 4,60 €', action: 'Zurücklegen' };
    return { it: this.props.item || demo };
  }
}
</script>
</body>
</html>
