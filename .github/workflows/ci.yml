name: CI

on:
  pull_request:
  push:
    branches: [main, "claude/**"]

# Отменяем устаревший прогон ветки при новом пуше (частые инкременты не копят
# очередь на серийном раннере). Группа по ref → main и ветки не пересекаются.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    # X2b-опт (2026-08-19): прогон делится на 3 ПАРАЛЛЕЛЬНЫЕ группы — раньше все
    # ~4300 тестов шли одной джобой ~15,5 мин (при том, что внутри уже был
    # `-n auto`). Создание тест-БД (django-tenants, ~250 миграций) стоит ~80 с и
    # платится в каждой джобе, поэтому дробить мельче невыгодно. Объединение
    # групп покрывает ВСЕ тесты: g3 = «всё, кроме g1 и g2» (через --ignore),
    # так что новый apps/* автоматически попадает в g3 и не теряется.
    strategy:
      fail-fast: false
      matrix:
        group: [g1, g2, g3]

    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: platform
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U platform"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # config.settings.development читает эти переменные (env.read_env молча
      # пропускает отсутствующий .env и берёт из окружения).
      SECRET_KEY: ci-test-secret-key-not-for-production
      DEBUG: "True"
      ALLOWED_HOSTS: "*"
      DB_NAME: platform
      DB_USER: platform
      DB_PASSWORD: platform
      DB_HOST: localhost
      DB_PORT: "5432"
      REDIS_URL: redis://localhost:6379/0
      REDIS_CACHE_URL: redis://localhost:6379/1
      REDIS_RESULT_URL: redis://localhost:6379/2

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        # Решение 5а (2026-08-06): строго из uv.lock (--locked падает при
        # рассинхроне лока) — свежий релиз на PyPI больше не может уронить CI
        # (прецедент: pytest-django 4.13.0, 2026-08-06). Обновление зависимостей —
        # осознанный `uv lock` в коммите.
        run: uv sync --locked --extra dev

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Build CSS & check freshness (Tailwind, P5)
        run: |
          npm ci
          npm run build:css
          git diff --exit-code static/css/app.css || { echo "::error::static/css/app.css устарел — выполните 'npm run build:css' и закоммитьте."; exit 1; }

      - name: Compile translations
        # L4: .mo не в git — компилируем перед тестами (все локали: de/en/tr/ru/uk).
        # msgfmt напрямую (без Django-настроек); --check-format ловит битые
        # placeholder'ы в переводах.
        run: |
          sudo apt-get install -y --no-install-recommends gettext
          for po in locale/*/LC_MESSAGES/django.po; do
            msgfmt --check-format -o "${po%.po}.mo" "$po"
          done

      - name: i18n coverage (I18N-9)
        # Строка в коде без записи в .po молча выводится по-немецки в ru/tr/uk/en.
        # Гейт гоняет makemessages во временную локаль и сверяет с реальными .po.
        run: uv run python scripts/i18n_gap.py

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Run tests (${{ matrix.group }})
        # Параллельно по ядрам раннера (-n auto). django-tenants: каждый воркер
        # получает свою тест-БД (test_<db>_gwN); --dist loadscope группирует тесты
        # модуля/класса на один воркер (стабильнее с общими фикстурами/схемой).
        # --durations=15 печатает самые долгие тесты — материал для точечной
        # оптимизации (известный кандидат: billing webhook-тесты по ~60 с).
        run: |
          case "${{ matrix.group }}" in
            g1) TARGET="apps/core apps/billing apps/aggregator" ;;
            g2) TARGET="apps/tenants apps/catalog apps/orders apps/inventory" ;;
            g3) TARGET=". --ignore=apps/core --ignore=apps/billing --ignore=apps/aggregator --ignore=apps/tenants --ignore=apps/catalog --ignore=apps/orders --ignore=apps/inventory" ;;
          esac
          uv run pytest -ra -n auto --dist loadscope --durations=15 $TARGET
