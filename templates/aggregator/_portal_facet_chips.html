{% load i18n %}{% if facets %}
<div class="flex flex-wrap items-center gap-2 mb-6">
  {% if district_chips %}<span class="text-sm font-medium text-gray-500 mr-1">{% trans "Branche" %}:</span>{% endif %}
  <a href="{% if district %}{% url 'portal-district' district=district %}{% else %}{% url 'portal-home' %}{% endif %}{% if chip_carry %}?{{ chip_carry }}{% endif %}"
     class="px-3 py-1.5 rounded-full text-sm border {% if not facet %}bg-gray-900 text-white border-gray-900{% else %}bg-white border-gray-200 text-gray-600 hover:border-gray-400{% endif %}">{% trans "All" %}</a>
  {% for v, label in facets %}
    <a href="{% if district %}{% url 'portal-district-facet' district=district facet=v %}{% else %}{% url 'portal-facet' facet=v %}{% endif %}{% if chip_carry %}?{{ chip_carry }}{% endif %}"
       class="px-3 py-1.5 rounded-full text-sm border {% if facet == v %}bg-gray-900 text-white border-gray-900{% else %}bg-white border-gray-200 text-gray-600 hover:border-gray-400{% endif %}">{{ label }}</a>
  {% endfor %}
</div>
{% endif %}
