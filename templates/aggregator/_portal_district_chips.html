{% load i18n %}{% comment %}T-8.17: районы города — чипы и страницы /stadtteil/<slug>/.{% endcomment %}
{% if district_chips %}
<nav data-district-chips aria-label="{% trans "Stadtteile" %}" class="flex flex-wrap items-center gap-2 mb-3">
  <span class="text-sm font-medium text-gray-500 mr-1">{% trans "Stadtteil" %}:</span>
  <a href="{% url 'portal-home' %}{% if chip_carry %}?{{ chip_carry }}{% endif %}"
     class="px-3 py-1.5 rounded-full text-sm border {% if not district %}bg-gray-900 text-white border-gray-900{% else %}bg-white border-gray-200 text-gray-600 hover:border-gray-400{% endif %}">{% trans "Alle" %}</a>
  {% for slug, name in district_chips %}
    <a href="{% url 'portal-district' district=slug %}{% if chip_carry %}?{{ chip_carry }}{% endif %}"
       class="px-3 py-1.5 rounded-full text-sm border {% if district == slug %}bg-gray-900 text-white border-gray-900{% else %}bg-white border-gray-200 text-gray-600 hover:border-gray-400{% endif %}">{{ name }}</a>
  {% endfor %}
</nav>
{% endif %}
