{% load i18n %}{# T-8.19: плитки разделов справочника — только непустые. #}
{% if tiles %}
<section data-section-tiles id="kategorien" class="mb-10 scroll-mt-32" aria-labelledby="home-tiles">
  <h2 id="home-tiles" class="text-lg font-semibold mb-3">{% trans "Bereiche entdecken" %}</h2>
  <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-3">
    {% for t in tiles %}
      <a href="{{ t.url }}" data-section-tile="{{ t.key }}" class="flex items-center gap-2 rounded-xl bg-white border border-gray-200 px-3 py-2.5 hover:border-gray-400">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="shrink-0" style="color: var(--portal-color)"><path d="{{ t.svg }}"></path></svg>
        <span class="min-w-0 flex-1 text-sm font-medium leading-tight">{{ t.label }}</span>
        <span data-tile-count class="text-xs text-gray-400">{{ t.count }}</span>
      </a>
    {% endfor %}
  </div>
</section>
{% endif %}
