{% load i18n %}{% if kind_chips %}
<nav class="mb-3 flex flex-wrap gap-2" aria-label="{% trans "Was suchen Sie?" %}" data-kind-chips>
  {% for c in kind_chips %}
    <a href="{{ c.url }}" data-kind-chip="{{ c.key }}" class="px-3.5 py-1.5 rounded-full text-sm font-medium border {% if c.active %}text-white border-transparent{% else %}bg-white border-gray-200 text-gray-700 hover:border-gray-400{% endif %}"{% if c.active %} style="background: var(--portal-color)"{% endif %}>{{ c.label }}</a>
  {% endfor %}
</nav>
{% endif %}
