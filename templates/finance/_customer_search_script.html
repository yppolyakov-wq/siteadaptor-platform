{% comment %}KA-P4b: живой поиск клиента формы счёта (вынесено из invoices.html, UX-D D6.5).{% endcomment %}
<script>
/* KA-P4b: живой поиск клиента — подменяет варианты селекта (без JS работает GET-форма). */
(function () {
  var timer = null, ctrl = null;
  document.addEventListener("input", function (ev) {
    var input = ev.target.closest && ev.target.closest("[data-customer-search]");
    if (!input) return;
    clearTimeout(timer);
    timer = setTimeout(function () {
      var q = input.value.trim();
      var select = document.querySelector("[data-customer-select]");
      if (!select || q.length < 2) return;
      if (ctrl) ctrl.abort();
      ctrl = new AbortController();
      fetch(input.dataset.url + "?q=" + encodeURIComponent(q), {signal: ctrl.signal, headers: {"Accept": "application/json"}})
        .then(function (r) { return r.ok ? r.json() : {items: []}; })
        .then(function (data) {
          var keep = select.value;
          var current = select.options[select.selectedIndex];
          select.length = 1;
          if (keep && current) select.add(new Option(current.text, keep, true, true));
          (data.items || []).forEach(function (it) {
            if (it.id === keep) return;
            select.add(new Option(it.sub ? it.label + " — " + it.sub : it.label, it.id));
          });
        })
        .catch(function () {});
    }, 250);
  });
  document.addEventListener("submit", function (ev) {
    if (ev.target.matches("[data-customer-search-form]") && document.querySelector("[data-customer-select]")) {
      var input = ev.target.querySelector("[data-customer-search]");
      if (input && input.value.trim().length >= 2) { ev.preventDefault(); input.dispatchEvent(new Event("input", {bubbles: true})); }
    }
  });
})();
</script>
