{% load i18n %}{% for q in ff.custom %}<div>
    {% if q.type == "bool" %}<label class="flex items-center gap-2 text-sm font-medium"><input type="checkbox" name="{{ q.id }}" value="1"{% if q.value %} checked{% endif %}{% if q.req %} required{% endif %}> {{ q.label }}{% if q.req %}<span aria-hidden="true"> *</span><span class="sr-only"> ({% trans "Pflichtfeld" %})</span>{% endif %}</label>{% else %}<label class="block text-sm font-medium mb-1" for="id_{{ q.id }}">{{ q.label }}{% if q.req %}<span aria-hidden="true"> *</span><span class="sr-only"> ({% trans "Pflichtfeld" %})</span>{% endif %}</label>
    {% if q.type == "textarea" %}<textarea id="id_{{ q.id }}" name="{{ q.id }}" rows="3" maxlength="500"{% if q.req %} required{% endif %} class="w-full rounded-lg border border-gray-300 px-3 py-2">{% if q.value %}{{ q.value }}{% endif %}</textarea>{% elif q.type == "choice" %}<select id="id_{{ q.id }}" name="{{ q.id }}"{% if q.req %} required{% endif %} class="w-full rounded-lg border border-gray-300 px-3 py-2 bg-white"><option value="">{% trans "Bitte wählen" %}</option>{% for value, label, lang in q.choices %}<option value="{{ value }}"{% if lang %} lang="{{ lang }}"{% endif %}{% if q.value and q.value == value %} selected{% endif %}>{{ label }}</option>{% endfor %}</select>{% else %}<input id="id_{{ q.id }}" name="{{ q.id }}" type="{% if q.type == 'number' %}number{% elif q.type == 'date' %}date{% else %}text{% endif %}"{% if q.type == 'number' %} step="any"{% elif q.type == 'text' %} maxlength="240"{% endif %}{% if q.value %} value="{{ q.value }}"{% endif %}{% if q.req %} required{% endif %} class="w-full rounded-lg border border-gray-300 px-3 py-2">{% endif %}{% endif %}
  </div>
  {% endfor %}
