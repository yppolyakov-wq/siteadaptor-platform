{% comment %}Системные чипы (SF-2): тумблеры-ссылки, carry остальных параметров
в URL; на мобильном — горизонтальный скролл, не перенос в 3 строки.
LB-3: общий партиал обычной страницы и панели полосы прыжков.{% endcomment %}
<div class="flex gap-2 mb-4 overflow-x-auto" data-promo-filters>
    {% for c in system_chips %}
      <a href="{{ c.url }}"
         class="shrink-0 whitespace-nowrap px-3 py-1.5 rounded-full text-sm border {% if c.active %}bg-gray-900 text-white border-gray-900{% else %}border-gray-300 text-gray-600 hover:bg-gray-100{% endif %}">{{ c.label }}</a>
    {% endfor %}
  </div>
