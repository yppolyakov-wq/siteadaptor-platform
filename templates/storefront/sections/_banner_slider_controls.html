{% load i18n %}{% comment %}FB-29.2: управление слайдером баннеров — пауза (WCAG 2.2.2), стрелки, точки. Скрыто, пока не отработал скрипт: без скриптов виден первый баннер, и мёртвых кнопок нет. Параметры: slides, arrows.{% endcomment %}
<button type="button" class="hidden absolute right-3 top-3 z-10 h-11 w-11 items-center justify-center rounded-full bg-white/85 text-gray-900 ring-1 ring-black/40 hover:bg-white focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600" data-hero-toggle data-label-pause="{% trans 'Bannerwechsel anhalten' %}" data-label-play="{% trans 'Bannerwechsel fortsetzen' %}" aria-label="{% trans 'Bannerwechsel anhalten' %}"><span aria-hidden="true" data-hero-toggle-icon>❚❚</span></button>
{% if arrows %}
<button type="button" class="hidden absolute left-3 top-1/2 z-10 h-11 w-11 -translate-y-1/2 items-center justify-center rounded-full bg-white/85 text-xl text-gray-900 ring-1 ring-black/40 hover:bg-white focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600" data-hero-prev aria-label="{% trans 'Vorheriger Banner' %}"><span aria-hidden="true">‹</span></button>
<button type="button" class="hidden absolute right-3 top-1/2 z-10 h-11 w-11 -translate-y-1/2 items-center justify-center rounded-full bg-white/85 text-xl text-gray-900 ring-1 ring-black/40 hover:bg-white focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600" data-hero-next aria-label="{% trans 'Nächster Banner' %}"><span aria-hidden="true">›</span></button>
{% endif %}
<div class="hidden absolute bottom-2 left-1/2 z-10 -translate-x-1/2 gap-1" role="group" aria-label="{% trans 'Banner wählen' %}" data-hero-dots>
  {% for h in slides %}<button type="button" class="flex h-8 w-8 items-center justify-center rounded-full focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-white" data-hero-dot aria-label="{% blocktrans with n=forloop.counter total=slides|length %}Banner {{ n }} von {{ total }}{% endblocktrans %}"{% if forloop.first %} aria-current="true"{% endif %}><span class="block h-2.5 w-2.5 rounded-full ring-1 ring-black/40 {% if forloop.first %}bg-white{% else %}bg-white/50{% endif %}" data-hero-dot-mark></span></button>{% endfor %}
</div>
