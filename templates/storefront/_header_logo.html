{% comment %}NAV-v2: логотип шапки (вынесен из _base — две ветки стилей).{% endcomment %}
<a href="{% url 'storefront-home' %}" class="shrink-0 flex items-center gap-2 font-bold tracking-tight">
  {% if request.tenant.logo_url %}<img src="{{ request.tenant.logo_url }}" alt="{{ request.tenant.name|default:'' }}" class="h-8 w-auto max-w-[170px] object-contain">{% else %}<span class="text-lg">{{ request.tenant.name|default:"Shop" }}</span>{% endif %}
</a>
