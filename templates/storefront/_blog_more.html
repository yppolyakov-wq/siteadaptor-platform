{% load i18n %}{% if recent %}
<div class="max-w-2xl mx-auto mt-12 border-t border-gray-100 pt-6">
  <h2 class="text-lg font-semibold mb-3">{% trans "More posts" %}</h2>
  <ul class="space-y-2">
    {% for p in recent %}
      <li><a href="{% url 'storefront-blog-post' p.slug %}" class="text-indigo-600 hover:underline">{{ p.title }}</a>{% if p.published_at %} <span class="text-xs text-gray-400">· {{ p.published_at|date:"d.m.Y" }}</span>{% endif %}</li>
    {% endfor %}
  </ul>
</div>
{% endif %}
