{% load i18n %}{% comment %}FB-33 M3-1: часть «Wie anordnen» — смена вида внутри семьи (M2e).{% endcomment %}
{% if selected.view_options %}{# FB-33 M2e: смена вида внутри семьи — отдельной формой, тексты не смешиваются #}
<form method="post" class="mt-3 flex flex-wrap items-end gap-2" data-schema-switch>
  {% csrf_token %}
  {% include "tenant/_schema_keep.html" %}
  <input type="hidden" name="ref" value="{{ selected.ref }}">
  <label class="text-sm flex-1 min-w-[10rem]"><span class="block text-xs text-gray-600 mb-1">{% trans "Ansicht" %}</span>
    <select name="value" class="ui-input w-full">
      {% for value, label in selected.view_options %}<option value="{{ value }}"{% if value == selected.key %} selected{% endif %}>{{ label }}</option>{% endfor %}
    </select></label>
  <button name="op" value="switch" class="ui-btn ui-btn-secondary">{% trans "Ansicht wechseln" %}</button>
</form>
{% endif %}
