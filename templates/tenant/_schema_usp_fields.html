{% load i18n %}{% comment %}FB-32 S2: поля одного пункта полосы доверия (i — номер, icon/label/text — значения).{% endcomment %}
<fieldset>
  <legend class="text-xs font-semibold text-gray-700 mb-1">{% trans "Symbol" %}</legend>
  <div class="flex flex-wrap gap-1">
    {% for key, sym in usp.icons %}<label class="relative"><input type="radio" name="f_usp_{{ i }}_icon" value="{{ key }}" class="peer sr-only"{% if key == icon %} checked{% endif %}><span class="flex items-center justify-center min-h-[44px] min-w-[44px] rounded-lg border border-gray-300 text-lg peer-checked:border-2 peer-checked:border-indigo-700 peer-checked:bg-indigo-50 peer-focus-visible:ring-2 peer-focus-visible:ring-indigo-600" title="{{ key }}"><span aria-hidden="true">{{ sym }}</span><span class="sr-only">{{ key }}</span></span></label>{% endfor %}
  </div>
</fieldset>
<label class="block text-sm"><span class="block text-xs font-semibold text-gray-700 mb-1">{% trans "Titel" %}</span><input type="text" name="f_usp_{{ i }}_label" value="{{ label }}" maxlength="120" class="ui-input w-full"></label>
<label class="block text-sm"><span class="block text-xs font-semibold text-gray-700 mb-1">{% trans "Text" %}</span><input type="text" name="f_usp_{{ i }}_text" value="{{ text }}" maxlength="200" class="ui-input w-full"></label>
