{% load i18n %}{# Кнопки шага мастера (D0c): «Weiter» сабмитит форму шага, «Überspringen»/«Zurück» — отдельные POST-действия. #}
<div class="flex items-center gap-3 pt-4">
  {% if step_num > 1 %}
    <button type="submit" name="action" value="back" formnovalidate class="text-sm text-gray-500 px-3 py-2.5 hover:underline">← {% trans "Zurück" %}</button>
  {% endif %}
  <button type="submit" class="bg-indigo-600 text-white text-sm font-medium px-5 py-2.5 rounded-lg hover:bg-indigo-700">{% trans "Weiter" %}</button>
  <button type="submit" name="action" value="skip" formnovalidate class="text-sm text-gray-500 px-3 py-2.5 hover:underline">{% trans "Überspringen" %}</button>
</div>
