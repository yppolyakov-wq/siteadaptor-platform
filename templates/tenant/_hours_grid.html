{% load i18n %}<div class="space-y-2">
  {% for r in opening_hours_rows %}
    <div class="flex items-center gap-2">
      <span class="w-9 text-sm font-medium text-gray-600">{{ r.label }}</span>
      <input aria-label="{{ r.label }} {% trans "Von" %}" type="time" name="oh_{{ r.wd }}_open" value="{{ r.open }}" class="flex-1 min-w-0 rounded-lg border border-gray-300 px-2 py-2 text-sm">
      <span class="text-gray-400" aria-hidden="true">–</span>
      <input aria-label="{{ r.label }} {% trans "Bis" %}" type="time" name="oh_{{ r.wd }}_close" value="{{ r.close }}" class="flex-1 min-w-0 rounded-lg border border-gray-300 px-2 py-2 text-sm">
    </div>
  {% endfor %}
</div>
