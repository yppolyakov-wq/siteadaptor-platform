{% load i18n %}
{% comment %}T-8.30: мост к Telegram Mini App без SDK (сторонний JS не работает рядом с
сессией кабинета): готовность, развернуть, закрыть. Кнопка «Schließen» видна, только если
мост есть (в обычном браузере её нет).{% endcomment %}
<div class="text-right -mt-1 mb-2" data-tg-close-row hidden>
  <button type="button" data-tg-close class="rounded-full bg-white shadow-sm px-3 py-1.5 text-sm text-gray-700">✕ {% trans "Schließen" %}</button>
</div>
<script>
(function () {
  function bridge() {
    if (window.TelegramWebviewProxy && window.TelegramWebviewProxy.postEvent) {
      return function (type, data) { window.TelegramWebviewProxy.postEvent(type, JSON.stringify(data || {})); };
    }
    if (window.external && typeof window.external.notify === "function") {
      return function (type, data) { window.external.notify(JSON.stringify({eventType: type, eventData: data || {}})); };
    }
    return null;
  }
  var post = bridge();
  if (!post) return;
  // T-8.30e: приём событий клиента (нативный сканер QR) — тот же протокол, что у SDK:
  // клиент зовёт window.Telegram.WebView.receiveEvent(type, data). Прежний приёмник
  // сохраняем и зовём (на случай чужого кода).
  var handlers = Object.create(null);
  function receive(type, data) {
    (handlers[type] || []).forEach(function (fn) { try { fn(data || {}); } catch (e) {} });
  }
  window.Telegram = window.Telegram || {};
  var prevWeb = window.Telegram.WebView && window.Telegram.WebView.receiveEvent;
  window.Telegram.WebView = window.Telegram.WebView || {};
  window.Telegram.WebView.receiveEvent = function (type, data) {
    receive(type, data);
    if (prevWeb) { try { prevWeb(type, data); } catch (e) {} }
  };
  window.TelegramGameProxy = window.TelegramGameProxy || {};
  window.TelegramGameProxy.receiveEvent = window.Telegram.WebView.receiveEvent;
  window.saTgBridge = {
    post: post,
    on: function (type, fn) { (handlers[type] = handlers[type] || []).push(fn); }
  };
  try { post("web_app_ready"); post("web_app_expand"); } catch (e) { return; }
  document.querySelectorAll("[data-tg-close-row]").forEach(function (b) { b.hidden = false; });
  document.addEventListener("click", function (e) {
    if (e.target.closest("[data-tg-close]")) post("web_app_close");
  });
  // Фидбэк 2026-10-23: tel:/mailto: Telegram из своего окна не открывает («Anrufen»
  // молчал) — показываем номер с «Kopieren»; внешние ссылки — через Telegram.
  var pending = "";
  window.saTgBridge.on("popup_closed", function (d) {
    if (d && d.button_id === "copy" && pending && navigator.clipboard) {
      navigator.clipboard.writeText(pending).catch(function () {});
    }
    pending = "";
  });
  document.addEventListener("click", function (e) {
    var a = e.target.closest && e.target.closest("a[href]");
    if (!a) return;
    var href = a.getAttribute("href") || "";
    if (/^(tel|mailto):/i.test(href)) {
      e.preventDefault();
      pending = decodeURIComponent(href.replace(/^(tel|mailto):/i, ""));
      post("web_app_open_popup", {
        message: pending,
        buttons: [{id: "copy", type: "default", text: "{{ _('Kopieren')|escapejs }}"}, {id: "close", type: "close"}]
      });
      return;
    }
    if (/^https?:/i.test(href) && a.host && a.host !== window.location.host) {
      e.preventDefault();
      post("web_app_open_link", {url: a.href});
    }
  });
})();
</script>
