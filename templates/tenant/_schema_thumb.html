{% comment %}FB-29.3: миниатюра списка — столько колонок и рядов, сколько задано блоку; лента — обрезанный ряд. Вход: shape {cols, cells, out}, big (в панели).{% endcomment %}<span class="mt-2 {% if shape.out == "slider" %}flex overflow-hidden{% else %}grid{% endif %} gap-1.5" aria-hidden="true" data-schema-thumb="cards" data-thumb-cols="{{ shape.cols }}" data-thumb-out="{{ shape.out }}"{% if shape.out != "slider" %} style="grid-template-columns: repeat({{ shape.cols }}, minmax(0, 1fr))"{% endif %}>{% for _cell in shape.cells %}<span class="{% if big %}h-9{% else %}h-5{% endif %} rounded {% if big %}bg-indigo-200{% else %}bg-gray-200{% endif %}{% if shape.out == "slider" %} shrink-0{% endif %}"{% if shape.out == "slider" %} style="width: calc({% widthratio 100 shape.cols 1 %}% + 8%)"{% endif %}></span>{% endfor %}{% if shape.out == "slider" %}<span class="{% if big %}h-9{% else %}h-5{% endif %} w-6 shrink-0 rounded {% if big %}bg-indigo-100{% else %}bg-gray-100{% endif %}"></span>{% endif %}</span>
