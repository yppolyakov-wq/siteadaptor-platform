{% load i18n %}
{% comment %}FB-30.12b: поля общие для мастера (`_payment_fields.html`) и карточек экрана (`_payment_cards.html`); сентинел секции ставит вызывающий.{% endcomment %}
<label class="flex items-center gap-2 text-sm font-medium">
  <input type="checkbox" name="invoice_b2b_enabled" {% if invoice_b2b_enabled or pay_art == "invoice" %}checked{% endif %}>
  {% trans "Offer «Kauf auf Rechnung» to companies" %}
</label>
<p class="text-xs text-gray-500">{% trans "Private customers always pay in advance, online or on site." %}</p>
<div class="grid sm:grid-cols-2 gap-3">
  <label class="text-sm">{% trans "Payment term (days)" %}
    <input type="number" name="invoice_terms_days" min="1" max="90" value="{{ invoice_terms_days }}" class="ui-input mt-1">
  </label>
  <label class="text-sm">{% trans "Hold without payment, bank transfer (days)" %}
    <input type="number" name="vorkasse_hold_days" min="1" max="30" value="{{ vorkasse_hold_days }}" class="ui-input mt-1">
  </label>
</div>
