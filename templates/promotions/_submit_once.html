{% comment %}T-8.30g: форма с data-once отправляется один раз — двойной тап у прилавка
не гасит дважды (сервер всё равно защищён: FSM брони, expect у ваучера).{% endcomment %}
<script>
document.addEventListener("submit", function (e) {
  var f = e.target;
  if (!f.matches || !f.matches("form[data-once]")) return;
  if (f.dataset.sent) { e.preventDefault(); return; }
  f.dataset.sent = "1";
  f.querySelectorAll("button").forEach(function (b) { b.disabled = true; });
});
// «Назад» из bfcache возвращает страницу с заблокированной формой — разблокируем.
window.addEventListener("pageshow", function (e) {
  if (!e.persisted) return;
  document.querySelectorAll("form[data-once]").forEach(function (f) {
    delete f.dataset.sent;
    f.querySelectorAll("button").forEach(function (b) { b.disabled = false; });
  });
});
</script>
