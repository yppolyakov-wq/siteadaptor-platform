{% load i18n %}
{% comment %}UX-D D6.4: «＋ Gutscheine erzeugen» — шторка и страница без JS.{% endcomment %}
<form method="post" action="{% url 'promotions:voucher-new' %}" class="space-y-4" data-drawer-form data-drawer-after="close">
  {% csrf_token %}
  <input type="hidden" name="next" value="{{ next_url }}">
  {% include "promotions/_list_form_fields.html" %}
  <div class="flex justify-end gap-2 pt-2{% if in_drawer %} sticky bottom-0 bg-white pb-1{% endif %}">
    <button class="ui-btn ui-btn-primary">{% trans "Generate" %}</button>
  </div>
</form>
