<main class="flex-1 w-full max-w-none mx-auto px-4 py-6 md:py-10">
<div class="">
<div class="mb-6">
  <h1 class="text-2xl md:text-3xl font-bold">Galerie</h1>
  <p class="text-gray-500 mt-1">Impressionen aus unserem Betrieb.</p>
</div>
<section data-reveal class="mb-10" data-sf-media-slot="gallery">
  <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-3" data-sf-cols="2/3/3" data-sf-tail="trim" data-sf-auto="1">
      <button type="button" data-lightbox="/media/g1.jpg"
              class="aspect-square rounded-3xl overflow-hidden bg-gray-100 block cursor-zoom-in group">
        <img src="/media/g1.jpg" alt="" loading="lazy" decoding="async"
             class="w-full h-full object-cover group-hover:scale-[1.03] transition">
      </button>
      <button type="button" data-lightbox="/media/g2.jpg"
              class="aspect-square rounded-3xl overflow-hidden bg-gray-100 block cursor-zoom-in group">
        <img src="/media/g2.jpg" alt="" loading="lazy" decoding="async"
             class="w-full h-full object-cover group-hover:scale-[1.03] transition">
      </button>
      <button type="button" data-lightbox="/media/g3.jpg"
              class="aspect-square rounded-3xl overflow-hidden bg-gray-100 block cursor-zoom-in group">
        <img src="/media/g3.jpg" alt="" loading="lazy" decoding="async"
             class="w-full h-full object-cover group-hover:scale-[1.03] transition">
      </button>
  </div>
</section>
<script>
(function () {
  document.querySelectorAll(".js-video-embed").forEach(function (el) {
    function load() {
      var f = document.createElement("iframe");
      f.src = el.dataset.src + "?autoplay=1";
      f.title = "Video";
      f.allow = "autoplay; encrypted-media; fullscreen";
      f.setAttribute("allowfullscreen", "");
      f.className = "w-full h-full absolute inset-0 border-0";
      el.innerHTML = "";
      el.appendChild(f);
    }
    el.addEventListener("click", load);
    el.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); load(); } });
  });
})();
</script>
</div>
  <div class="mt-8" data-pb-host="gallery">
<div data-sf-section="t-tg"
     class="contents"
     style="">
<section class="my-8">
  <div class="cb-box max-w-3xl mx-auto px-4">
    <h2 class="text-xl md:text-2xl font-bold mb-2">Über uns</h2>
    <p class="text-gray-700 leading-relaxed whitespace-pre-line">Seit 1999</p>
  </div>
</section>
</div>
  </div>
  </main>
