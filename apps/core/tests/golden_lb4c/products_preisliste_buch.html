0.18em] uppercase" style="color: var(--accent, #4f46e5);">Kuchen</div> <div class="mx-auto mt-1.5 w-10 border-b-2" style="border-color: var(--accent, #4f46e5);"></div> </div> <a href="/sortiment/kuchen/apfelkuchen/" class="group block py-2 border-b border-dotted border-gray-300 last:border-0"> <span class="flex items-baseline gap-2"> <span class="font-medium group-hover:underline">Apfelkuchen</span> <span class="flex-1 min-w-4"></span> <span class="font-bold whitespace-nowrap" style="font-variant-numeric: tabular-nums;">2,40 €</span> </span> <span class="block text-sm text-gray-500 italic mt-0.5">Apfelkuchen aus dem Ofen.</span> </a> </div> <div class="md:px-5" data-book-page> <div class="text-center mb-2 mt-1"> <div class="text-[11px] font-bold tracking-[0.18em] uppercase" style="color: var(--accent, #4f46e5);">Torten</div> <div class="mx-auto mt-1.5 w-10 border-b-2" style="border-color: var(--accent, #4f46e5);"></div> </div> <a href="/sortiment/torten/sachertorte/" class="group block py-2 border-b border-dotted border-gray-300 last:border-0"> <span class="flex items-baseline gap-2"> <span class="font-medium group-hover:underline">Sachertorte</span> <span class="flex-1 min-w-4"></span> <span class="font-bold whitespace-nowrap" style="font-variant-numeric: tabular-nums;">24,90 €</span> </span> <span class="block text-sm text-gray-500 italic mt-0.5">Sachertorte aus dem Ofen.</span> </a> </div> </div> <div class="mt-5 hidden items-center justify-center gap-3 text-sm" data-book-nav data-book-pattern="Seite __R__ von __N__"> <button type="button" data-book-prev aria-label="Zurückblättern" class="w-9 h-9 rounded-full border border-gray-300 text-gray-600 disabled:opacity-30">‹</button> <span data-book-status class="text-gray-500" style="font-variant-numeric: tabular-nums;"></span> <button type="button" data-book-next aria-label="Weiterblättern" class="w-9 h-9 rounded-full border border-gray-300 text-gray-600 disabled:opacity-30">›</button> </div> </div> <script> (function () { if (window.__sfPriceBookBound) return; window.__sfPriceBookBound = true; function setup(book) { var pages = [].slice.call(book.querySelectorAll("[data-book-page]")); var nav = book.querySelector("[data-book-nav]"); if (!nav || pages.length <= 1) return; // одна группа — листать нечего var prev = nav.querySelector("[data-book-prev]"); var next = nav.querySelector("[data-book-next]"); var status = nav.querySelector("[data-book-status]"); var idx = 0; // На телефоне разворот вырождается в одну страницу (две колонки блюд с // ценой там нечитаемы) — то же правило, что у сеток (мобильный кап). function per() { return window.matchMedia("(min-width: 768px)").matches ? 2 : 1; } function render() { var n = per(); idx = Math.max(0, Math.min(idx, pages.length - n)); pages.forEach(function (p, i) { p.hidden = !(i >= idx && i < idx + n); }); var last = Math.min(idx + n, pages.length); if (status) { var range = last > idx + 1 ? idx + 1 + "–" + last : String(idx + 1); // Целая переведённая фраза с плейсхолдерами (см. _price_list.html): // сборка из отдельных слов давала «Seite 1–2 откуда 8». status.textContent = (nav.getAttribute("data-book-pattern") || "__R__ / __N__") .replace("__R__", range) .replace("__N__", pages.length); } if (prev) prev.disabled = idx <= 0; if (next) next.disabled = idx + n >= pages.length; } function move(dir) { idx += dir * per(); render(); } if (prev) prev.addEventListener("click", function () { move(-1); }); if (next) next.addEventListener("click", function () { move(1); }); window.addEventListener("resize", render); // Свайп по развороту (владелец: «с листанием») — порог, чтобы обычная // вертикальная прокрутка страницу не перелистывала. var x0 = null; book.addEventListener("touchstart", function (e) { x0 = e.touches[0].clientX; }, { passive: true }); book.addEventListener("touchend", function (e) { if (x0 === null) return; var dx = e.changedTouches[0].clientX - x0; x0 = null; if (Math.abs(dx) > 60) move(dx < 0 ? 1 : -1); }, { passive: true }); // Показ — через классы: атрибут hidden проигрывает утилите .flex (ревью). nav.classList.remove("hidden"); nav.classList.add("flex"); render(); } function init() { document.querySelectorAll("[data-price-book]").forEach(setup); } if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init); else init(); })(); </script> <div class="mt-4 flex gap-2"> <a href="/sortiment/" class="inline-block rounded-lg border border-gray-300 px-4 py-2 text-sm font-medium hover:border-gray-400">Ganze Speisekarte →</a> <a href="/speisekarte.pdf" target="_blank" rel="noopener" class="inline-block rounded-lg border border-gray-300 px-4 py-2 text-sm font-medium hover:border-gray-400">📄 Speisekarte als PDF</a> </div> </div> </section>
