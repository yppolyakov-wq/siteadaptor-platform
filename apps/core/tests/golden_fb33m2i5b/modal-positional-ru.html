<div class="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
  <div class="absolute inset-0 bg-black/50" data-quick-close></div>
  <div class="relative w-full sm:max-w-2xl max-h-[92vh] overflow-y-auto rounded-t-2xl sm:rounded-2xl"
       role="dialog" aria-modal="true" aria-label="Запрос без обязательств" data-anfrage-modal>
    <button type="button" data-quick-close
            class="absolute top-3 right-3 z-10 w-9 h-9 rounded-full bg-white/95 shadow text-gray-500 hover:text-gray-800 text-2xl leading-none"
            aria-label="Закрыть">&times;</button>
    <div class="bg-white rounded-t-2xl sm:rounded-2xl px-5 pt-5">
      <h2 class="text-xl font-bold pr-10">Запрос без обязательств</h2>
      <p class="text-sm text-gray-500 mt-1">Мы вернёмся с предложением — бесплатно и без обязательств.</p>
    </div>
<form method="post" action="/anfrage/" enctype="multipart/form-data" class="bg-white rounded-2xl shadow-sm p-6 space-y-4 max-w-2xl mx-auto">
  <input type="hidden" name="csrfmiddlewaretoken" value="X">
  <input type="text" name="website" tabindex="-1" autocomplete="off" class="hidden" aria-hidden="true">
  <div>
    <label class="block text-sm font-medium mb-1" for="id_title">Что вам нужно?<span aria-hidden="true"> *</span><span class="sr-only"> (Обязательное поле)</span></label>
    <input id="id_title" name="title" type="text" required value="" placeholder="например, покрасить две комнаты" class="w-full rounded-lg border border-gray-300 px-3 py-2">
  </div>
  <div class="grid sm:grid-cols-3 gap-3">
    <div>
      <label class="block text-sm font-medium mb-1" for="id_event_date">Wann?</label>
      <input id="id_event_date" name="event_date" type="date" class="w-full rounded-lg border border-gray-300 px-3 py-2">
    </div>
    <div>
      <label class="block text-sm font-medium mb-1" for="id_guest_count">Количество гостей<span aria-hidden="true"> *</span><span class="sr-only"> (Обязательное поле)</span></label>
      <input id="id_guest_count" name="guest_count" type="number" min="1" max="100000" inputmode="numeric" required class="w-full rounded-lg border border-gray-300 px-3 py-2">
    </div>
    <div>
      <label class="block text-sm font-medium mb-1" for="id_event_type">Тип мероприятия (необязательно)</label>
      <select id="id_event_type" name="event_type" class="w-full rounded-lg border border-gray-300 px-3 py-2 bg-white">
        <option value="">—</option>
        <option value="Hochzeit">Свадьба</option><option value="Firmenfeier">Корпоратив</option>
      </select>
    </div>
  </div>
  <div class="flex gap-3">
    <div class="flex-1">
      <label class="block text-sm font-medium mb-1" for="id_addr">Адрес места работы (необязательно)</label>
      <input id="id_addr" name="site_address" type="text" class="w-full rounded-lg border border-gray-300 px-3 py-2">
    </div>
  </div>
  <div>
    <label class="block text-sm font-medium mb-1" for="id_q1">Budget</label>
    <input id="id_q1" name="q1" type="text" class="w-full rounded-lg border border-gray-300 px-3 py-2">
  </div>
  <div>
    <label class="block text-sm font-medium mb-1" for="id_q2">Raum<span aria-hidden="true"> *</span><span class="sr-only"> (Обязательное поле)</span></label>
    <select id="id_q2" name="q2" required class="w-full rounded-lg border border-gray-300 px-3 py-2 bg-white"><option value="">Выберите</option><option value="Saal" lang="de">Saal</option><option value="Garten" lang="de">Garten</option></select>
  </div>
  <div>
    <label class="flex items-center gap-2 text-sm font-medium"><input type="checkbox" name="q4" value="1"> Vegan?</label>
  </div>
  <div class="grid sm:grid-cols-3 gap-4">
    <div>
      <label class="block text-sm font-medium mb-1" for="id_name">Имя<span aria-hidden="true"> *</span><span class="sr-only"> (Обязательное поле)</span></label>
      <input id="id_name" name="name" type="text" required class="w-full rounded-lg border border-gray-300 px-3 py-2">
    </div>
    <div>
      <label class="block text-sm font-medium mb-1" for="id_email">Электронная почта</label>
      <input autocomplete="email" id="id_email" name="email" type="email" class="w-full rounded-lg border border-gray-300 px-3 py-2">
    </div>
    <div>
      <label class="block text-sm font-medium mb-1" for="id_phone">Handy<span aria-hidden="true"> *</span><span class="sr-only"> (Обязательное поле)</span></label>
      <input autocomplete="tel" id="id_phone" name="phone" type="tel" required class="w-full rounded-lg border border-gray-300 px-3 py-2">
    </div>
  </div>
  <div>
    <label class="block text-sm font-medium mb-1" for="id_photos">Фотографии (необязательно, до 5)</label>
    <input id="id_photos" name="photos" type="file" accept="image/*" multiple class="w-full text-sm text-gray-600">
    <p class="text-xs text-gray-600 mt-1">Фотография объекта поможет нам быстрее составить смету.</p>
  </div>
  <button type="submit" class="w-full text-white rounded-lg px-4 py-3 font-medium hover:opacity-90" style="background: var(--accent, #4f46e5);">Отправить запрос</button>
<p class="basis-full sm:col-span-full mt-2 text-xs text-gray-500" data-privacy-note>Мы используем ваши данные только для обработки вашего обращения. Фотографии мы используем только для вашего предложения. <a href="/datenschutz/" class="underline" target="_top">Политика конфиденциальности</a></p>
</form>
  </div>
</div>
