<main class="flex-1 w-full max-w-none mx-auto px-4 py-6 md:py-10">
<div class="max-w-5xl mx-auto lg:grid lg:grid-cols-[minmax(0,1fr)_20rem] lg:gap-8 lg:items-start" data-contact-layout>
<div class="max-w-xl mx-auto lg:max-w-none lg:mx-0">
  <h1 class="text-2xl md:text-3xl font-bold mb-1">Eine Frage stellen</h1>
  <p class="text-gray-500 mb-6">Schreiben Sie uns eine Nachricht – wir melden uns bei Ihnen.</p>
<form method="post" action="/nachricht/" class="bg-white rounded-2xl shadow-sm p-6 space-y-4">
    <input type="hidden" >
    <input type="text" name="website" tabindex="-1" autocomplete="off" class="hidden" aria-hidden="true">
    <input type="hidden" name="ref_kind" value="">
    <input type="hidden" name="ref_id" value="">
    <input type="hidden" name="ref_label" value="">
    <div>
      <label class="block text-sm font-medium mb-1" for="id_subject">Betreff</label>
      <input id="id_subject" name="subject" type="text" value="" class="w-full rounded-lg border border-gray-300 px-3 py-2">
    </div>
    <div>
      <label class="block text-sm font-medium mb-1" for="id_body">Nachricht *</label>
      <textarea id="id_body" name="body" rows="4" required class="w-full rounded-lg border border-gray-300 px-3 py-2"></textarea>
    </div>
    <div class="grid sm:grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-medium mb-1" for="id_name">Name</label>
        <input id="id_name" name="name" type="text" value="" autocomplete="name" class="w-full rounded-lg border border-gray-300 px-3 py-2">
      </div>
      <div>
        <label class="block text-sm font-medium mb-1" for="id_email">E-Mail</label>
        <input id="id_email" name="email" type="email" value="" autocomplete="email" class="w-full rounded-lg border border-gray-300 px-3 py-2">
        <p class="text-xs text-gray-400 mt-1">Damit wir Ihnen antworten können.</p>
      </div>
      <div>
        <label class="block text-sm font-medium mb-1" for="id_msg_phone">Telefon</label>
        <input id="id_msg_phone" name="phone" type="tel" value="" autocomplete="tel" class="w-full rounded-lg border border-gray-300 px-3 py-2">
      </div>
    </div>
    <button type="submit" class="w-full bg-indigo-600 text-white rounded-lg px-4 py-3 font-medium hover:bg-indigo-700">Nachricht senden</button>
<p class="basis-full sm:col-span-full mt-2 text-xs text-gray-500" data-privacy-note>Wir verwenden Ihre Angaben nur, um Ihr Anliegen zu bearbeiten. <a href="/datenschutz/" class="underline" target="_top">Datenschutzerklärung</a></p>
  </form>
</div>
<aside class="mt-6 lg:mt-0 lg:sticky lg:top-24" data-contact-aside>
<section class="sf-card bg-white rounded-2xl border border-gray-200 p-5" data-business-card>
  <div class="flex items-center gap-3 flex-wrap mb-3">
    <h2 class="font-semibold">So finden Sie uns</h2>
  </div>
  <div class="grid gap-4 text-sm text-gray-600">
    <div>
      <p class="font-medium text-gray-800">Laden X</p>
      <p class="whitespace-pre-line">Hauptstr. 1, 42651 Solingen</p>
    </div>
    <div class="flex flex-col gap-2">
      <a href="https://www.google.com/maps/dir/?api=1&amp;destination=Hauptstr.%201%2C%2042651%20Solingen" target="_blank" rel="noopener" data-route class="inline-flex items-center justify-center gap-2 rounded-xl px-4 py-2.5 font-semibold text-white hover:opacity-90" style="background: var(--accent, #4f46e5);">📍 Route planen</a>
    </div>
  </div>
</section>
</aside>
</div>
  <div class="mt-8" data-pb-host="message">
<div data-sf-section="t-s6"
     class="contents"
     style="">
<section class="my-8">
  <div class="cb-box max-w-3xl mx-auto px-4">
    <h2 class="text-xl md:text-2xl font-bold mb-2">Anfahrt</h2>
    <p class="text-gray-700 leading-relaxed whitespace-pre-line">Bus 5</p>
  </div>
</section>
</div>
  </div>
