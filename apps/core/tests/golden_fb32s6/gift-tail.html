<main class="flex-1 w-full max-w-none mx-auto px-4 py-6 md:py-10">
<div class="max-w-xl mx-auto">
  <h1 class="text-2xl md:text-3xl font-bold mb-1">Geschenkgutschein</h1>
  <p class="text-gray-500 mb-6">Verschenken Sie einen Aufenthalt – bezahlen Sie sicher online und erhalten Sie den Code per E-Mail.</p>
  <form method="post" action="/gutschein/kaufen/" class="bg-white rounded-2xl shadow-sm p-6 space-y-4">
    <input type="hidden" >
    <div>
      <label class="block text-sm font-medium mb-1" for="id_amount">Betrag (€)</label>
      <div class="flex flex-wrap gap-2 mb-2">
          <button type="button" class="gift-preset px-3 py-1.5 rounded-lg border border-gray-300 text-sm hover:border-indigo-400" data-eur="50">50 €</button>
          <button type="button" class="gift-preset px-3 py-1.5 rounded-lg border border-gray-300 text-sm hover:border-indigo-400" data-eur="100">100 €</button>
          <button type="button" class="gift-preset px-3 py-1.5 rounded-lg border border-gray-300 text-sm hover:border-indigo-400" data-eur="150">150 €</button>
          <button type="button" class="gift-preset px-3 py-1.5 rounded-lg border border-gray-300 text-sm hover:border-indigo-400" data-eur="200">200 €</button>
      </div>
      <input id="id_amount" name="amount_eur" type="number" min="10" max="2000" step="1" required value="100" class="w-40 rounded-lg border border-gray-300 px-3 py-2">
    </div>
    <div class="grid sm:grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-medium mb-1" for="id_name">Ihr Name *</label>
        <input id="id_name" name="name" type="text" required class="w-full rounded-lg border border-gray-300 px-3 py-2">
      </div>
      <div>
        <label class="block text-sm font-medium mb-1" for="id_email">Ihre E-Mail-Adresse *</label>
        <input autocomplete="email" id="id_email" name="email" type="email" required class="w-full rounded-lg border border-gray-300 px-3 py-2">
      </div>
    </div>
    <div>
      <label class="block text-sm font-medium mb-1" for="id_recipient">Name des Empfängers (optional)</label>
      <input id="id_recipient" name="recipient" type="text" class="w-full rounded-lg border border-gray-300 px-3 py-2">
    </div>
    <div>
      <label class="block text-sm font-medium mb-1" for="id_message">Nachricht (optional)</label>
      <textarea id="id_message" name="message" rows="2" class="w-full rounded-lg border border-gray-300 px-3 py-2"></textarea>
    </div>
    <input type="text" name="website" tabindex="-1" autocomplete="off" class="hidden" aria-hidden="true">
    <button type="submit" class="w-full bg-indigo-600 text-white rounded-lg px-4 py-3 font-medium hover:bg-indigo-700">Zahlungspflichtig bestellen</button>
    <p class="text-xs text-gray-400">Der Gutscheincode gilt für Direktbuchungen auf dieser Website.</p>
<p class="basis-full sm:col-span-full mt-2 text-xs text-gray-500" data-privacy-note>Wir verwenden Ihre Angaben nur, um Ihr Anliegen zu bearbeiten. <a href="/datenschutz/" class="underline" target="_top">Datenschutzerklärung</a></p>
  </form>
</div>
<script>
  document.querySelectorAll(".gift-preset").forEach(function (b) {
    b.addEventListener("click", function () {
      document.getElementById("id_amount").value = b.dataset.eur;
    });
  });
</script>
  <div class="mt-8" data-pb-host="gift">
<div data-sf-section="t-s6"
     class="contents"
     style="">
<section class="my-8">
  <div class="cb-box max-w-3xl mx-auto px-4">
    <h2 class="text-xl md:text-2xl font-bold mb-2">Anfahrt</h2>
    <p class="text-gray-700 leading-relaxed whitespace-pre-line">Bus 5</p>
  </div>
</section>
</div>
  </div>
