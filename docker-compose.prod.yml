# Production stack.
#
# Два режима запуска:
#   1) Один сервер (dev/тест): Postgres крутится здесь же, в Docker.
#        docker compose -f docker-compose.prod.yml --profile single up -d
#        (в .env.prod:  DB_HOST=db)
#   2) Прод: Postgres на отдельном db-сервере (CCX13), сюда НЕ поднимается.
#        docker compose -f docker-compose.prod.yml up -d
#        (в .env.prod:  DB_HOST=<приватный IP db-сервера>)
#
# Redis и Caddy крутятся здесь в обоих режимах.
# Деплой: ./scripts/deploy.sh [single]  (см. docs/DEVELOPMENT-GUIDE.md → Деплой)

services:
  # Локальный Postgres — только в режиме single (профиль). На проде с отдельным
  # db-сервером этот сервис не стартует.
  db:
    image: postgres:16.15-alpine  # SEC-G11b: закреплённая версия (обновление — правкой тега)
    profiles: ["single"]
    # SEC-G12b: pg_dump берёт блокировку на КАЖДУЮ таблицу в одной транзакции, а схема на
    # бизнес — это ~210 таблиц: при ~136 схемах ~28 000 блокировок против ~6 400 по
    # умолчанию (64 × max_connections) → «out of shared memory», бэкап не делался вовсе.
    # 1024 × 100 соединений ≈ 100 000 блокировок (~480 бизнесов), ~25 МБ общей памяти.
    # Больше бизнесов — поднять PG_MAX_LOCKS_PER_TRANSACTION в .env.prod.
    command: ["postgres", "-c", "max_locks_per_transaction=${PG_MAX_LOCKS_PER_TRANSACTION:-1024}"]
    # T-12: /dev/shm у Docker по умолчанию 64 МБ. Параллельные запросы Postgres кладут туда
    # общую память; при пересеве демо в 3 потока копия схемы-шаблона падала «could not resize
    # shared memory segment … No space left on device» (диск при этом свободен) и откатывалась
    # на медленные миграции. Поднять — PG_SHM_SIZE в .env.prod.
    shm_size: ${PG_SHM_SIZE:-512mb}
    # SEC-G11: только свои переменные (раньше env_file отдавал Postgres все ключи
    # приложения — Stripe, Telegram, SECRET_KEY). Значения подставляет --env-file.
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    # T-10: один образ на web/worker/beat — собирается один раз (раньше у каждого
    # сервиса был свой `build: .`, и compose собирал тот же образ трижды).
    build: .
    image: siteadaptor-app:latest
    env_file: .env.prod
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
    # collectstatic при старте самого web-контейнера: одноразовый `run --rm`
    # складывал статику в эфемерный контейнер, а у gunicorn /app/staticfiles был
    # пуст → ManifestStaticFilesStorage падал 500 на /admin/.
    # timeout 180: регистрация бизнеса создаёт PG-схему и гоняет миграции всех
    # TENANT-приложений (~1 мин и растёт с каждым модулем) — при 60s gunicorn
    # убивал воркер и регистрация падала. Асинхронный провижининг — roadmap.
    command: >-
      sh -c "python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 180"
    expose:
      - "8000"
    volumes:
      - media:/app/media  # загруженные картинки переживают передеплой
    networks:
      default:
        # Алиас, чтобы Caddy слал on-demand TLS ask-запрос с Host: siteadaptor.de
        # (резолвится в public-схему → verify_domain отвечает 200).
        aliases:
          - siteadaptor.de
    depends_on:
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-H", "Host: siteadaptor.de", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    image: siteadaptor-app:latest
    pull_policy: never  # образ собирает сервис web
    env_file: .env.prod
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
    command: celery -A config worker -l info --concurrency 4
    volumes:
      - media:/app/media  # воркеру нужен доступ к файлам, загруженным web (CSV-импорт)
    depends_on:
      - redis
    restart: unless-stopped

  beat:
    image: siteadaptor-app:latest
    pull_policy: never  # образ собирает сервис web
    env_file: .env.prod
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - media:/app/media
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7.4.12-alpine  # SEC-G11b: закреплённая версия
    # SEC-G11: пароль Redis — по желанию (REDIS_PASSWORD в .env.prod + тот же пароль в
    # REDIS_URL/CELERY_BROKER_URL: redis://:<пароль>@redis:6379/0). Пусто — как раньше.
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command: >-
      sh -c 'if [ -n "$$REDIS_PASSWORD" ]; then exec redis-server --requirepass "$$REDIS_PASSWORD";
             else exec redis-server; fi'
    restart: unless-stopped
    volumes:
      - redisdata:/data

  caddy:
    build: ./caddy
    # SEC-G11: Caddy переменные окружения не нужны — секреты приложения ему не отдаём.
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    restart: unless-stopped

volumes:
  pgdata:        # данные Postgres в режиме single; деплой их не стирает
  media:         # загруженные картинки товаров (переживают передеплой)
  redisdata:
  caddy_data:
  caddy_config:
